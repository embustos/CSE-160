<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE 160 – Assignment 5: Solar System</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%);
      color: #aef; font-size: 18px; pointer-events: none;
      text-shadow: 0 0 6px #0af;
      line-height: 1.8;
      text-align: center;
    }
    #hud h2 { font-size: 26px; color: #fff; margin-bottom: 6px; }

    #info-panel {
      position: fixed; top: 18px; right: 18px;
      width: 280px;
      background: rgba(0,10,30,0.85);
      border: 1px solid #0af;
      border-radius: 10px;
      padding: 18px;
      color: #cef;
      font-size: 16px;
      line-height: 1.7;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0,160,255,0.3);
    }
    #info-panel h3 { color: #fff; font-size: 20px; margin-bottom: 8px; }
    #info-panel .close-btn {
      position: absolute; top: 8px; right: 12px;
      cursor: pointer; color: #0af; font-size: 22px;
      pointer-events: all;
      line-height: 1;
    }
    #info-panel .close-btn:hover { color: #fff; }

    #bottom-left-stack {
      position: fixed; bottom: 18px; left: 18px;
      display: flex; flex-direction: column; gap: 12px;
      max-width: 280px;
    }

    #wow-note {
      color: #cdf; font-size: 14px; line-height: 1.5;
      background: rgba(0,10,30,0.7);
      border-radius: 8px; padding: 10px 14px;
      border: 1px solid #0af6;
    }

    #controls {
      color: #aef; font-size: 16px;
      background: rgba(0,10,30,0.7);
      border: 1px solid #0af4;
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(4px);
    }
    #controls label { display: block; margin-bottom: 6px; }
    #controls input[type=range] { width: 200px; accent-color: #0af; }

    #boost-btn {
      margin-top: 12px;
      width: 100%;
      background: linear-gradient(135deg, #ff6600, #ffaa00);
      color: #fff;
      border: 1px solid #ffcc66;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(255,140,0,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    #boost-btn:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 0 18px rgba(255,180,0,0.7);
    }
    #boost-btn:disabled {
      background: #444;
      border-color: #666;
      cursor: not-allowed;
      box-shadow: none;
      color: #aaa;
    }

    #signature {
      position: fixed; bottom: 18px; right: 18px;
      color: #cdf; font-size: 14px; line-height: 1.5;
      background: rgba(0,10,30,0.7);
      border: 1px solid #0af6;
      border-radius: 8px;
      padding: 10px 14px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h2>Solar System Explorer</h2>
    <div>Left-drag: orbit &nbsp;|&nbsp; Right-drag: pan</div>
    <div>Scroll: zoom &nbsp;|&nbsp; Click planet: info</div>
  </div>

  <div id="info-panel">
    <span class="close-btn" id="close-info">&times;</span>
    <h3 id="info-name"></h3>
    <div id="info-body"></div>
  </div>

  <div id="bottom-left-stack">
    <div id="wow-note">
      WOW: Click any planet for facts, use the speed slider, and hit BOOST to speed up the spaceship!
    </div>

    <div id="controls">
      <label>Orbit Speed: <span id="speed-val">1.0</span>x</label>
      <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
      <button id="boost-btn">BOOST SPACESHIP</button>
    </div>
  </div>

  <div id="signature">
    Name: Emiliano Bustos<br>
    School Email: ebustos@ucsc.edu
  </div>

  <script type="module" src="asgn5.js"></script>

</body>
</html>
